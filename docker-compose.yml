services:
  api:
    build:
      context: .
      target: dev
    ports:
      - '3000:3000'
    env_file:
      - .env.development.local
    volumes:
      - ./src:/app/src
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"
